<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CV Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Open+Sans:wght@300;400;500;600;700;800&family=Lato:wght@300;400;700;900&family=Poppins:wght@300;400;500;600;700;800&family=Montserrat:wght@300;400;500;600;700;800&family=Raleway:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&family=Oswald:wght@400;500;600&family=Nunito:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"/>
<style>
:root{
  --bg:#09090f;--s1:#0f0f17;--s2:#14141e;--s3:#1a1a26;
  --bo:rgba(255,255,255,.06);--bo2:rgba(255,255,255,.11);
  --tx:#dde0f0;--mu:#4e5068;--mu2:#6b6e8a;
  --cy:#00f0d0;--mg:#e040fb;--rd:#f45;--gn:#00d68f;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--tx);font-family:'Inter',sans-serif;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;gap:10px;padding:9px 16px;background:var(--s1);border-bottom:1px solid var(--bo2);flex-shrink:0;flex-wrap:wrap;}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:.9rem;color:var(--cy);letter-spacing:-.02em;}
.logo span{color:var(--mg);}
.vsep{width:1px;height:18px;background:var(--bo2);flex-shrink:0;}
.hint{font-size:.62rem;color:var(--mu2);}
.tr{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap;}
.zw{display:flex;align-items:center;gap:3px;}
.zl{font-size:.56rem;color:var(--mu);text-transform:uppercase;letter-spacing:.12em;}
.zb{width:22px;height:22px;border-radius:3px;border:1px solid var(--bo2);background:var(--s3);color:var(--tx);font-size:.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.13s;}
.zb:hover{border-color:var(--cy);color:var(--cy);}
.zv{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--cy);min-width:32px;text-align:center;}
.btn{padding:5px 12px;font-size:.63rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-radius:3px;border:1px solid var(--bo2);cursor:pointer;transition:.13s;font-family:'Inter',sans-serif;background:var(--s3);color:var(--mu2);}
.btn:hover{border-color:var(--cy);color:var(--cy);}
.btn.pri{background:var(--cy);color:#060a0e;border-color:var(--cy);}
.ab{display:grid;grid-template-columns:300px 1fr;flex:1;overflow:hidden;min-height:0;}
.jp{background:var(--s1);border-right:1px solid var(--bo);display:flex;flex-direction:column;overflow:hidden;}
.ph{padding:9px 14px;border-bottom:1px solid var(--bo);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mu2);display:flex;align-items:center;gap:6px;flex-shrink:0;}
.phd{width:4px;height:4px;border-radius:50%;background:var(--cy);}
#ji{flex:1;resize:none;padding:13px;background:transparent;border:none;outline:none;color:#7ecfb5;font-family:'JetBrains Mono',monospace;font-size:.67rem;line-height:1.85;overflow-y:auto;tab-size:2;}
#ji::placeholder{color:var(--mu);font-size:.64rem;line-height:1.9;}
.jf{padding:7px 14px;border-top:1px solid var(--bo);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.st{font-size:.6rem;font-family:'JetBrains Mono',monospace;transition:color .2s;}
.st.ok{color:var(--cy);}.st.er{color:var(--rd);}.st.id{color:var(--mu2);}
.sc{font-size:.58rem;color:var(--mu2);font-family:'JetBrains Mono',monospace;}
.pp{overflow:auto;background:#12121c;display:flex;align-items:flex-start;justify-content:center;padding:36px 28px;}
.pi{display:flex;flex-direction:column;align-items:center;}

/* THE KEY FIX: cvw must be position:relative with explicit width+height */
/* cvs must be position:absolute — NOT using minHeight */
.cvw{
  position:relative !important;
  transform-origin:top center;
  box-shadow:0 24px 80px rgba(0,0,0,.8);
  flex-shrink:0;
  overflow:hidden;
}
.cvs{
  position:absolute !important;
  box-sizing:border-box;
  overflow:hidden;
}
.cvs:hover{outline:1px dashed rgba(0,240,208,.25);z-index:9999 !important;}

.em{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:80px 28px;color:var(--mu);}
.ei{font-size:2.6rem;opacity:.15;}
.et{font-family:'Syne',sans-serif;font-size:.85rem;color:var(--tx);opacity:.25;}
.es{font-size:.72rem;line-height:1.85;max-width:240px;color:var(--mu2);}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--s3);border-radius:2px;}
@media print{
  .topbar,.jp{display:none!important;}
  .ab{display:block!important;}
  .pp{padding:0!important;background:#fff!important;overflow:visible!important;display:block!important;}
  .cvw{transform:none!important;box-shadow:none!important;}
  html,body{height:auto;overflow:visible!important;}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">cv<span>.</span>viewer</div>
  <div class="vsep"></div>
  <span class="hint">Paste exported JSON → renders pixel-perfect</span>
  <div class="tr">
    <div class="zw">
      <span class="zl">Zoom</span>
      <button class="zb" onclick="dz(-.12)">−</button>
      <span class="zv" id="zv">100%</span>
      <button class="zb" onclick="dz(.12)">+</button>
      <button class="zb" style="width:auto;padding:0 7px;font-size:.53rem;" onclick="fz()">FIT</button>
    </div>
    <div class="vsep"></div>
    <button class="btn" onclick="ls()">Sample JSON</button>
    <button class="btn pri" onclick="window.print()">⬇ Print / PDF</button>
  </div>
</div>
<div class="ab">
  <div class="jp">
    <div class="ph"><span class="phd"></span>CV JSON</div>
    <textarea id="ji" spellcheck="false" placeholder="Paste your exported CV JSON here…

Supports all element types:
  shape · line · image · icon
  freetext · textBlock · badge
  progressBar · timeline · separator
  listBlock · experienceBlock
  educationBlock · skillsBlock
  projectsBlock · languageBlock
  certBlock · referenceBlock
  socialBlock · interestBlock"></textarea>
    <div class="jf">
      <div class="st id" id="st">Waiting for JSON…</div>
      <div class="sc" id="sc"></div>
    </div>
  </div>
  <div class="pp" id="pp">
    <div class="pi" id="pi">
      <div class="em">
        <div class="ei">🖼️</div>
        <div class="et">No CV loaded</div>
        <p class="es">Paste your exported JSON from CV Builder, or click <strong>Sample JSON</strong>.</p>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';
var scale=1;
var $i=document.getElementById('ji');
var $s=document.getElementById('st');
var $c=document.getElementById('sc');

// ── ZOOM ──────────────────────────────────────
function dz(d){scale=Math.max(.15,Math.min(3,scale+d));az();}
function fz(){
  var pp=document.getElementById('pp');
  var w=document.querySelector('.cvw');
  if(!w)return;
  var aw=pp.clientWidth-56,ah=pp.clientHeight-72;
  var cw=+w.dataset.w||595,ch=+w.dataset.h||842;
  scale=Math.min(1,aw/cw,ah/ch);
  az();
}
function az(){
  document.getElementById('zv').textContent=Math.round(scale*100)+'%';
  var w=document.querySelector('.cvw');
  if(w)w.style.transform='scale('+scale+')';
}

// ── INPUT ─────────────────────────────────────
$i.addEventListener('input',function(){
  var raw=$i.value.trim();
  if(!raw){ss('id','Waiting for JSON…');$c.textContent='';empty();return;}
  try{
    var json=JSON.parse(raw);
    var data=resolve(json);
    var secs=data.sections||[];
    ss('ok','✓ Valid — '+secs.length+' element'+(secs.length!==1?'s':''));
    $c.textContent=data.canvas?(data.canvas.width+'×'+data.canvas.height+'px'):'';
    render(data);
  }catch(e){ss('er','✗ '+e.message);$c.textContent='';empty();}
});

function ss(cls,msg){$s.className='st '+cls;$s.textContent=msg;}
function empty(){
  document.getElementById('pi').innerHTML='<div class="em"><div class="ei">🖼️</div><div class="et">No CV loaded</div><p class="es">Paste JSON from CV Builder or click <strong>Sample JSON</strong>.</p></div>';
}

function resolve(j){
  if(j&&j.data&&(j.data.canvas||j.data.sections))return j.data;
  if(j&&j.canvas)return j;
  if(j&&j.sections)return j;
  var keys=Object.keys(j||{});
  for(var i=0;i<keys.length;i++){if(j[keys[i]]&&j[keys[i]].sections)return j[keys[i]];}
  return j;
}

// ── MAIN RENDER ──────────────────────────────
function render(data){
  var cv=data.canvas||{width:595,height:842,backgroundColor:'#FFFFFF'};
  var W=cv.width||595, H=cv.height||842;

  // Sort by zIndex — lower renders first (behind)
  var secs=(data.sections||[]).slice().sort(function(a,b){
    return ((a.transform||{}).zIndex||0)-((b.transform||{}).zIndex||0);
  });

  // Canvas wrapper: position:relative + EXACT width + height
  var wrap=document.createElement('div');
  wrap.className='cvw';
  wrap.dataset.w=W; wrap.dataset.h=H;
  wrap.style.position='relative';
  wrap.style.width=W+'px';
  wrap.style.height=H+'px';         // ← EXPLICIT height, not minHeight
  wrap.style.background=cv.backgroundColor||'#ffffff';
  wrap.style.transform='scale('+scale+')';
  wrap.style.transformOrigin='top center';
  wrap.style.overflow='hidden';

  secs.forEach(function(sec){
    if(sec.meta&&sec.meta.isHidden===true)return;
    var el=buildSec(sec);
    if(el)wrap.appendChild(el);
  });

  var pi=document.getElementById('pi');
  pi.innerHTML='';
  pi.appendChild(wrap);
  setTimeout(fz,80);
}

// ── SECTION WRAPPER ──────────────────────────
function buildSec(sec){
  var tf=sec.transform||{};
  var st=sec.style||{};
  var co=sec.content||{};
  var type=(sec.type||'').toLowerCase();

  // Every section: position:absolute, exact x/y/w/h, no minHeight
  var wrap=document.createElement('div');
  wrap.className='cvs';
  wrap.style.position='absolute';
  wrap.style.left  =(tf.x||0)+'px';
  wrap.style.top   =(tf.y||0)+'px';
  wrap.style.width =(tf.width||100)+'px';
  wrap.style.height=(tf.height||20)+'px';  // ← EXACT height always
  wrap.style.zIndex=tf.zIndex||1;
  wrap.style.boxSizing='border-box';
  wrap.style.overflow='visible';            // let text overflow naturally
  if(tf.rotation)wrap.style.transform='rotate('+tf.rotation+'deg)';
  if(st.opacity!==undefined)wrap.style.opacity=st.opacity;

  var inner=null;
  if     (type==='shape')           inner=bShape(co,st,tf);
  else if(type==='line'||type==='divider') inner=bLine(co,st,tf);
  else if(type==='image')           inner=bImage(co,st,tf);
  else if(type==='icon')            inner=bIcon(co,st,tf);
  else if(type==='freetext'||type==='text') inner=bFreetext(co,st,tf);
  else if(type==='textblock')       inner=bTextBlock(co,st,tf);
  else if(type==='badge')           inner=bBadge(co,st,tf);
  else if(type==='progressbar')     inner=bProgressBar(co,st,tf);
  else if(type==='timeline')        inner=bTimeline(co,st,tf);
  else if(type==='separator')       inner=bSeparator(co,st,tf);
  else if(type==='qrcode')          inner=bQR(co,st,tf);
  else if(type==='listblock')       inner=bList(co,st,tf);
  else if(type==='experienceblock') inner=bExp(co,st,tf);
  else if(type==='educationblock')  inner=bEdu(co,st,tf);
  else if(type==='skillsblock')     inner=bSkills(co,st,tf);
  else if(type==='projectsblock')   inner=bProjects(co,st,tf);
  else if(type==='languageblock')   inner=bLanguage(co,st,tf);
  else if(type==='certblock')       inner=bCert(co,st,tf);
  else if(type==='referenceblock')  inner=bReference(co,st,tf);
  else if(type==='socialblock')     inner=bSocial(co,st,tf);
  else if(type==='interestblock')   inner=bInterest(co,st,tf);
  // unknown: invisible — no debug box that causes overlap
  if(inner)wrap.appendChild(inner);
  return wrap;
}

// ═══════════════════════════════════════
// RENDERERS — each fills its space fully
// ═══════════════════════════════════════

function bShape(co,st,tf){
  var d=mk('div');
  d.style.width='100%'; d.style.height='100%';
  d.style.background=st.backgroundColor||st.fillColor||'transparent';
  d.style.borderRadius=px(st.borderRadius||0);
  d.style.border=(st.borderWidth||0)>0?(st.borderWidth+'px solid '+(st.borderColor||'#000')):'none';
  d.style.opacity=st.opacity!==undefined?st.opacity:1;
  d.style.overflow='hidden';
  return d;
}

function bLine(co,st,tf){
  var d=mk('div');
  var h=st.thickness||1;
  d.style.width='100%';
  d.style.height=h+'px';
  var ls=st.style||'solid';
  if(ls==='dashed'){d.style.borderBottom=h+'px dashed '+(st.color||'#ccc');d.style.background='none';}
  else if(ls==='dotted'){d.style.borderBottom=h+'px dotted '+(st.color||'#ccc');d.style.background='none';}
  else{d.style.background=st.color||st.backgroundColor||'#cccccc';}
  return d;
}

function bImage(co,st,tf){
  var d=mk('div');
  d.style.width='100%'; d.style.height='100%';
  d.style.borderRadius=px(st.borderRadius||0);
  d.style.border=(st.borderWidth||0)>0?(st.borderWidth+'px solid '+(st.borderColor||'transparent')):'none';
  d.style.background=st.backgroundColor||'#e0e4ec';
  d.style.overflow='hidden';
  d.style.display='flex'; d.style.alignItems='center'; d.style.justifyContent='center';
  if(co.src){
    var img=mk('img');
    img.src=co.src; img.alt=co.alt||'';
    img.style.cssText='width:100%;height:100%;object-fit:'+(st.objectFit||'cover')+';display:block;';
    img.onerror=function(){img.replaceWith(mkph('👤'));};
    d.appendChild(img);
  }else{d.appendChild(mkph('👤'));}
  return d;
}

function bIcon(co,st,tf){
  var d=mk('div');
  d.style.width='100%'; d.style.height='100%';
  d.style.display='flex'; d.style.alignItems='center'; d.style.justifyContent='center';
  var sp=mk('span');
  sp.textContent=co.emoji||co.icon||co.text||'★';
  sp.style.fontSize=px(st.fontSize||tf.width||20);
  sp.style.color=st.color||'#333333'; sp.style.lineHeight='1';
  d.appendChild(sp); return d;
}

function bFreetext(co,st,tf){
  var d=mk('div');
  d.style.width='100%'; d.style.height='100%';
  d.style.fontFamily=st.fontFamily||'Inter';
  d.style.fontSize=px(st.fontSize||16);
  d.style.fontWeight=st.bold?700:(st.fontWeight||400);
  d.style.color=st.color||'#222222';
  d.style.lineHeight=st.lineHeight||1.4;
  d.style.textAlign=st.textAlign||'left';
  d.style.fontStyle=st.italic?'italic':'normal';
  d.style.letterSpacing=px(st.letterSpacing||0);
  var td=''; if(st.underline)td+='underline '; if(st.strike)td+='line-through';
  if(td)d.style.textDecoration=td.trim();
  d.style.whiteSpace='pre-wrap'; d.style.wordBreak='break-word';
  d.style.overflow='visible';
  d.textContent=co.text||co.value||'';
  return d;
}

function bTextBlock(co,st,tf){
  var d=mk('div');
  d.style.width='100%'; d.style.textAlign=st.alignment||'left';
  if(co.title!=null){d.appendChild(bld(co.title,st.title||{fontSize:22,fontWeight:700,color:'#111'}));}
  if(co.subtitle!=null){var e=bld(co.subtitle,st.subtitle||{fontSize:13,fontWeight:500,color:'#555'});e.style.marginTop='3px';d.appendChild(e);}
  if(co.body!=null){var e=bld(co.body,st.body||{fontSize:11,color:'#666',lineHeight:1.6});e.style.marginTop='6px';d.appendChild(e);}
  return d;
}

function bBadge(co,st,tf){
  var d=mk('div');
  d.style.width='100%'; d.style.height='100%';
  d.style.display='inline-flex'; d.style.alignItems='center'; d.style.justifyContent='center';
  d.style.background=st.backgroundColor||'#e94560';
  d.style.borderRadius=px(st.borderRadius||99);
  d.style.overflow='hidden';
  var sp=mk('span');
  sp.textContent=co.text||'Badge';
  sp.style.fontFamily=st.fontFamily||'Inter';
  sp.style.fontSize=px(st.fontSize||10);
  sp.style.fontWeight=st.fontWeight||600;
  sp.style.color=st.color||'#ffffff';
  sp.style.padding=(st.paddingY||4)+'px '+(st.paddingX||10)+'px';
  sp.style.whiteSpace='nowrap';
  d.appendChild(sp); return d;
}

function bProgressBar(co,st,tf){
  var d=mk('div'); d.style.width='100%';
  if(st.showLabel!==false){
    var row=mk('div');
    row.style.cssText='display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;';
    var lb=mk('span'); lb.textContent=co.label||'Skill';
    lb.style.cssText='font-size:'+px(st.labelSize||10)+';font-weight:500;color:'+(st.labelColor||'#333')+';font-family:Inter;';
    row.appendChild(lb);
    if(st.showPercent!==false){
      var pc=mk('span'); pc.textContent=(co.value||80)+'%';
      pc.style.cssText='font-size:'+px(st.labelSize||10)+';color:'+(st.labelColor||'#888')+';';
      row.appendChild(pc);
    }
    d.appendChild(row);
  }
  var track=mk('div');
  track.style.cssText='width:100%;height:'+px(st.height||8)+';background:'+(st.trackColor||'#e8eaf0')+';border-radius:'+px(st.borderRadius||4)+';overflow:hidden;';
  var fill=mk('div');
  fill.style.cssText='width:'+(co.value||80)+'%;height:100%;background:'+(st.barColor||'#e94560')+';border-radius:'+px(st.borderRadius||4)+';';
  track.appendChild(fill); d.appendChild(track); return d;
}

function bTimeline(co,st,tf){
  var d=mk('div'); d.style.width='100%'; d.style.paddingLeft='16px';
  var inner=mk('div');
  inner.style.cssText='position:relative;border-left:2px solid '+(st.lineColor||'#e8eaf0')+';padding-left:12px;';
  var ds=st.dotSize||10;
  var dot=mk('div');
  dot.style.cssText='position:absolute;left:'+(-(Math.round(ds/2)+1))+'px;top:2px;width:'+ds+'px;height:'+ds+'px;background:'+(st.dotColor||'#e94560')+';border-radius:50%;';
  inner.appendChild(dot);
  if(co.title){var t=mk('div');t.textContent=co.title;t.style.cssText='font-size:'+px(st.titleSize||12)+';font-weight:600;color:'+(st.titleColor||'#111')+';font-family:Inter;';inner.appendChild(t);}
  if(co.subtitle){var t=mk('div');t.textContent=co.subtitle;t.style.cssText='font-size:'+px(st.subtitleSize||11)+';color:'+(st.subtitleColor||'#555')+';margin-top:1px;font-family:Inter;';inner.appendChild(t);}
  if(co.period){var t=mk('div');t.textContent=co.period;t.style.cssText='font-size:9px;color:'+(st.periodColor||'#888')+';margin-top:1px;font-family:Inter;';inner.appendChild(t);}
  d.appendChild(inner); return d;
}

function bSeparator(co,st,tf){
  var d=mk('div');
  d.style.width='100%'; d.style.height='100%';
  d.style.display='flex'; d.style.alignItems='center'; d.style.justifyContent='center';
  var sp=mk('span'); sp.textContent=co.text||'✦';
  sp.style.fontSize=px(st.fontSize||14); sp.style.color=st.color||'#cccccc';
  sp.style.fontFamily=st.fontFamily||'Inter'; sp.style.letterSpacing='8px';
  d.appendChild(sp); return d;
}

function bQR(co,st,tf){
  var d=mk('div');
  d.style.width='100%'; d.style.height='100%';
  d.style.background=st.backgroundColor||'#f8f8f8';
  d.style.border=(st.borderWidth||1)+'px solid '+(st.borderColor||'#ddd');
  d.style.borderRadius=px(st.borderRadius||4);
  d.style.display='flex'; d.style.flexDirection='column';
  d.style.alignItems='center'; d.style.justifyContent='center';
  var qr=mk('div'); qr.textContent='▦'; qr.style.cssText='font-size:2rem;opacity:.25;';
  var lb=mk('div'); lb.textContent=co.label||'QR Code';
  lb.style.cssText='font-size:'+px(st.labelSize||9)+';color:'+(st.labelColor||'#666')+';margin-top:4px;font-family:Inter;';
  d.appendChild(qr); d.appendChild(lb); return d;
}

function bList(co,st,tf){
  var d=mk('div'); d.style.width='100%';
  if(co.title)d.appendChild(secH(co.title,st.title||{}));
  var ICONS={phone:'📞',email:'✉️',location_on:'📍',language:'🌐',link:'🔗',work:'💼',school:'🎓',person:'👤',star:'⭐',code:'💻',build:'🔧',brush:'🎨',web:'🌐'};
  (co.items||[]).forEach(function(item){
    var row=mk('div');
    row.style.cssText='display:flex;align-items:flex-start;gap:6px;margin-bottom:'+px(st.spacing||7)+';';
    if(item.icon||item.emoji){
      var ic=mk('span');
      ic.textContent=ICONS[item.icon]||item.icon||item.emoji||'·';
      ic.style.cssText='font-size:'+px((st.icon&&st.icon.size)||11)+';color:'+((st.icon&&st.icon.color)||'#e94560')+';flex-shrink:0;margin-top:1px;line-height:1;';
      row.appendChild(ic);
    }
    var te=bld(item.text||'',st.itemText||{fontSize:10,color:'#444'});
    te.style.flex='1';

function mk(t){return document.createElement(t);}
function px(v){return(v!==undefined&&v!==null)?v+'px':'0px';}

function bld(text,s){
  var d=mk('div'); d.textContent=text||''; apTs(d,s); return d;
}
function apTs(el,s){
  el.style.fontFamily  =s.fontFamily  ||'Inter';
  el.style.fontSize    =px(s.fontSize ||12);
  el.style.fontWeight  =s.fontWeight  ||400;
  el.style.color       =s.color       ||'#222222';
  el.style.lineHeight  =s.lineHeight  ||1.4;
  if(s.letterSpacing!==undefined)el.style.letterSpacing=s.letterSpacing+(typeof s.letterSpacing==='string'?'':'em');
  if(s.textTransform)el.style.textTransform=s.textTransform;
  if(s.textAlign)    el.style.textAlign    =s.textAlign;
  if(s.fontStyle)    el.style.fontStyle    =s.fontStyle;
  if(s.textDecoration)el.style.textDecoration=s.textDecoration;
}
function secH(text,s){
  var d=bld(text,s); d.style.marginBottom='8px'; return d;
}
